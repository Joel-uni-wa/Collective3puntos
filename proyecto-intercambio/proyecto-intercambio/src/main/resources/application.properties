spring.application.name=collectiverse
server.port=8080

# ---- Conexion a Neon (PostgreSQL) ----
# Reemplaza los valores por los de TU proyecto de Neon (ver README.md),
# o define las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://HOST_DE_NEON/NOMBRE_BD?sslmode=require}
spring.datasource.username=${DB_USER:USUARIO_DE_NEON}
spring.datasource.password=${DB_PASSWORD:CLAVE_DE_NEON}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate crea/actualiza las tablas solas al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Pausa (en milisegundos) que hace el registro de publicacion entre revisar y guardar.
# Normalmente 0. Solo los tests de concurrencia la suben para que la condicion de carrera se vea.
app.demo.pausa-ms=0
